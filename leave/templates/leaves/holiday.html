{% extends "jobs/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Column -->
        <div class="col-md-4">
            {% include 'leaves/leaveManuBar.html' %}
        </div>

        <!-- Form Column -->
        <div class="col-md-8" style="max-width: 600px;"> <!-- Adjusted column width to 8 -->
            <div class="container" style="max-width: 600px;">
                {% if form.instance.pk %}
                <h2 class="text-center">Update Holiday</h2>
                {% else %}
                <h2 class="text-center">Holiday Entry</h2>
                {% endif %}
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="form-group row">
                        {{form|crispy}}
                </form>
                {% if form.instance.pk %}
                <button class="btn btn-primary btn-sm mt-4" type="submit">Update</button>
                {% else %}
                <button class="btn btn-primary btn-sm mt-4" type="submit">Submit</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
