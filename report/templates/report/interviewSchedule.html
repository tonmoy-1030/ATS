{% extends "jobs/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
<div class="container-fluid">
    <div class="row">
        <div  class="col-md-3">
            {% include 'documents/reportManuBar.html' %}
        </div>
    <div class="container mt-5" style="max-width: 600px;">
        <legend class="text-center mb-4">Interview Schedule</legend>
        <form method="post" class="form-group" target="_blank">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-primary mt-4">
                <i class="bi bi-arrow-down-circle"></i> Download
            </button>
        </form>
    </div>
</div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- Ensure jQuery and Select2 are loaded before this script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />

<script>

    $(document).ready(function () {
        $('#id_unit').select2();
        $('#id_format_').select2(); // Initialize Select2 on the select element with id 'id_unit'
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Function to update Select2 styles based on the theme
        function updateSelect2Styles() {
            const isDarkTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            const select2Containers = document.querySelectorAll('.select2-container--default .select2-selection--multiple .select2-selection__choice');
            const select2ContainersSingle = document.querySelectorAll('.select2-container--default .select2-selection--multiple');
            const select2DropDown = document.querySelectorAll('.select2-dropdown');

            select2ContainersSingle.forEach(container => {
                if (isDarkTheme) {
                    container.style.backgroundColor = '#00000000';
                    container.style.color = 'white';
                } else {
                    container.style.backgroundColor = '';
                    container.style.color = '';
                }
            });

            select2Containers.forEach(container => {
                if (isDarkTheme) {
                    container.style.backgroundColor = '#00000000';
                    container.style.color = 'white';
                } else {
                    container.style.backgroundColor = '';
                    container.style.color = '';
                }
            });

            select2DropDown.forEach(container => {
                if (isDarkTheme) {
                    container.style.backgroundColor = '#212529';
                    container.style.color = 'rgba(255, 255, 255, 0.8)';
                } else {
                    container.style.backgroundColor = 'white';
                    container.style.color = 'black';
                }
            });
        }


        // Function to periodically check for theme changes
        function checkThemePeriodically() {
            updateSelect2Styles();  // Update styles initially
            setTimeout(checkThemePeriodically, 5);  // Recheck every 5ms
        }

        // Start the periodic check
        checkThemePeriodically();

    });

</script>

{% endblock %}
