{% extends "jobs/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
<div class="container" style="max-width: 600px;">
    <form id="uploadForm" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset>
            <legend>Candidate's Resume (PDF, Word File, Image File)</legend>
            {{ form|crispy }}
        </fieldset>
        <button class="btn btn-primary btn-sm mt-4" type="submit"> 
            <i class="bi bi-send"></i> Submit
        </button>
    </form>

    <!-- Progress bar -->
    <div class="progress mt-3">
        <div class="progress-bar progress-bar-striped"  role="progressbar" 
             style="width: 0%;" 
             aria-valuenow="0" 
             aria-valuemin="0" 
             aria-valuemax="100">
            0%
        </div>
    </div>

    <!-- Success/Error message -->
    <div id="uploadStatus" class="mt-2"></div>
</div>
{% endblock %}

{% block extra_scripts %}


<script>
    $(document).ready(function() {
        var pk = "{{ view.kwargs.pk }}";  // Get the 'pk' from the view's context
        
        $('#uploadForm').on('submit', function(e) {
            e.preventDefault();  // Prevent the default form submission

            var formData = new FormData(this);
            var progressBar = $('.progress-bar');
            var displayProgress = $('.progress');
            var uploadStatus = $('#uploadStatus');
            var pollInterval;

            // Send the form via AJAX
            $.ajax({
                url: '',  // This posts the form to the same URL
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                beforeSend: function() {
                    progressBar.css('width', '0%');
                    progressBar.text('0%');
                    uploadStatus.html('');
            

                    // Start polling the server for progress
                    pollInterval = setInterval(function() {
                        $.getJSON('/upload/progress/' + pk + '/', function(data) {
                            var percentComplete = data.progress;
                            progressBar.css('width', percentComplete + '%');
                            progressBar.attr('aria-valuenow', percentComplete);
                            progressBar.text(percentComplete + '%');
                        });
                    }, 1000);  // Poll every 1 second
                },
                success: function(response) {
                     // Stop polling once upload is complete
                    uploadStatus.html('<div class="alert alert-success">Files uploaded successfully!</div>');
                },
                error: function(xhr, status, error) {
                    clearInterval(pollInterval);  // Stop polling on error
                    uploadStatus.html('<div class="alert alert-danger">File upload failed, please try again.</div>');
                }
            });
        });
    });
</script>
{% endblock %}
