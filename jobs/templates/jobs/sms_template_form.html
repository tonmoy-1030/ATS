{% extends "jobs/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
  <div class="container mt-4">
    <h2>Edit SMS Template: {{ object.name }}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
  </div>
{% endblock %}
